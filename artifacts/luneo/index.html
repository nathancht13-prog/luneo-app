    <style>
      html, body { margin: 0; background: #faf8f5; }
      .splash { min-height: 100dvh; display: flex; align-items: center; justify-content: center; }
      .splash-logo { width: 48px; height: 48px; border-radius: 50%; background: #f6c453; position: relative; overflow: hidden; animation: splash-pulse 1.6s ease-in-out infinite; }
      .splash-logo:before { content: ''; position: absolute; width: 38px; height: 38px; left: -9px; top: 3px; border-radius: 50%; background: #1e3a8a; }
      @keyframes splash-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.92); opacity: 0.75; } }
    </style>

    <div id="root"><div class="splash"><div class="splash-logo"></div></div></div>
